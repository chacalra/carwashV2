# Nginx interno del container frontend.
#
# Sirve el dist/ de Astro como SPA: si la URL no matchea un archivo,
# cae a index.html para que el cliente lo resuelva. Astro static genera
# rutas /sales/, /dashboard/, etc, asi que sin esto un refresh tira 404.
#
# IMPORTANTE: este nginx solo sirve el frontend. El proxy /api/* hacia
# el backend lo hace NGINX Proxy Manager en prod. En dev se hace via
# la network de docker compose: el frontend llama a /api/* y compose
# resuelve "backend" como host (ver PUBLIC_API_BASE_URL).
#
# Aclaracion: como `PUBLIC_API_BASE_URL=/api` en el build, el frontend
# pega a "/api/...". Para que dev funcione end-to-end dentro de compose,
# proxeamos /api -> backend:8000 desde aca tambien.

server {
    listen 80;
    server_name _;

    # Logs a stdout/stderr asi `docker logs` los captura.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Cuando nginx genera redirects 301 (ej. /login -> /login/), usar
    # rutas relativas en lugar de absolutas. Sin esto, mete el puerto
    # interno del container (80) y el browser queda en localhost:80
    # cuando el origen real era :8080 o un dominio prod via NPM.
    absolute_redirect off;
    server_name_in_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Cache agresivo para assets versionados (Astro les pone hash).
    location ~* \.(js|css|woff2?|ttf|otf|png|jpg|jpeg|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API: proxy al backend dentro de la red de compose.
    location /api/ {
        # Quita el prefijo /api antes de pasar al backend.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeouts razonables para imports legacy o reports pesados.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # SPA fallback: cualquier ruta no encontrada cae a index.html.
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

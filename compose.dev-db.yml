services:
  postgres:
    image: postgres:16
    container_name: carwash-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: carwash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - carwash_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carwash"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  carwash_pg_data:

# CD: push a main -> tests -> deploy al VPS via SSH.
#
# Requiere los siguientes secrets en GitHub:
#   SSH_HOST          - IP del VPS (164.68.127.94)
#   SSH_USER          - usuario SSH (ramon)
#   SSH_PORT          - puerto SSH (22)
#   SSH_PRIVATE_KEY   - private key dedicada (la pub esta en VPS)
#
# Estructura:
#   - Job `test`: corre suite backend (uv + pytest) y frontend (bun test + build).
#   - Job `deploy`: solo si `test` paso. Hace SSH al VPS y ejecuta deploy.sh.
#
# El deploy es idempotente: si el commit ya esta deployed, no hace nada
# (git pull no trae nada nuevo y docker compose up -d --build solo rebuildea
# imagenes con cambios).

name: Deploy

on:
  push:
    branches: [main]
  # Permite disparar manualmente desde la pestaña Actions.
  workflow_dispatch:

jobs:
  test:
    name: Test backend + frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Backend ---
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.13

      - name: Install backend deps
        run: uv sync --frozen

      - name: Run backend tests
        run: uv run pytest tests/ -q

      # --- Frontend ---
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        working-directory: frontend/web
        run: bun install --frozen-lockfile || bun install

      - name: Run frontend tests
        working-directory: frontend/web
        run: bun run test

      - name: Build frontend
        working-directory: frontend/web
        env:
          # Para el build de prod el frontend pega a /api del mismo origen.
          PUBLIC_API_BASE_URL: /api
        run: bun run build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    # No deploy si el push fue a una rama distinta de main (futuro-proof
    # si agregamos otras ramas que disparen el workflow).
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Acepta la host key del VPS sin pregunta interactiva.
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              'bash -s' < scripts/deploy.sh

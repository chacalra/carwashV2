name: Demo (GitHub Pages)

# Publica una demo navegable del frontend en GitHub Pages, sin backend:
# el build usa PUBLIC_DEMO=true, que responde la API con datos de ejemplo
# guardados en el navegador del visitante (src/lib/demo/backend.ts).
# URL: https://<usuario>.github.io/carwashV2/

on:
  push:
    branches: [main]
    paths:
      - "frontend/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; si llega otro push, se cancela el que estaba en curso.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: frontend/web
        run: bun install --frozen-lockfile || bun install

      - name: Run frontend tests
        working-directory: frontend/web
        run: bun run test

      - name: Build demo
        working-directory: frontend/web
        env:
          PUBLIC_DEMO: "true"
          DEMO_BASE: /${{ github.event.repository.name }}
        run: bunx astro build

      # Con build.format "file" existen a la vez sales.html y la carpeta sales/.
      # Duplicamos como sales/index.html para que /sales funcione resuelva
      # Pages el archivo o la carpeta.
      - name: Make clean URLs resolve
        working-directory: frontend/web/dist
        run: |
          for f in *.html; do
            d="${f%.html}"
            if [ -d "$d" ]; then cp "$f" "$d/index.html"; fi
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
